<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Taller · Hidroexpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b17;--bg2:#0d1426;--panel:#111a30;--panel2:#16213d;--line:#22305a;--tx:#e8eeff;--mut:#8b98bd;--acc:#f59e0b;--acc2:#ea580c;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;color:var(--tx);font-family:Inter,system-ui,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 10% -10%,rgba(59,130,246,.16),transparent 60%),radial-gradient(900px 500px at 110% 0%,rgba(245,158,11,.12),transparent 60%),var(--bg)}
button,select,input{font-family:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;position:sticky;top:0;z-index:20;background:rgba(7,11,23,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px -8px var(--acc)}
.logo-wrap{display:flex;align-items:center}
.logo-wrap img{height:56px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.brand .sep{width:1px;height:38px;background:var(--line)}
.logo-wrap .logo{display:none}
.logo-wrap.sin-logo img{display:none}
.logo-wrap.sin-logo .logo{display:grid}
.t1{font-size:20px;font-weight:900;letter-spacing:.2px}
.t2{font-size:12px;color:var(--mut);font-weight:500}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.season{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--acc);color:var(--tx)}
.clock{text-align:right;line-height:1.15}
#hora{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
#fecha{font-size:11px;color:var(--mut);text-transform:capitalize}
.sync{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--mut)}
.sync .l1{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
.dot.err{background:var(--bad);animation:none}
.dot.pausa{background:#64748b;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--tx);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;transition:border-color .2s}
.btn:hover{border-color:var(--acc)}
.btn.girando{animation:spin 1s linear infinite}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px 22px 6px}
.kpi{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-24px;bottom:-34px;width:96px;height:96px;border-radius:50%;background:var(--kc);opacity:.10}
.kl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:700}
.kv{font-size:30px;font-weight:900;margin-top:4px;color:var(--kc);font-variant-numeric:tabular-nums}
.ks{font-size:11px;color:var(--mut);margin-top:2px}
.strip{margin:10px 22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.strip-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:10px}
.eta-list,.lib-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.etac{min-width:160px;border-radius:12px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);cursor:pointer;transition:transform .15s}
.etac:hover{transform:translateY(-2px)}
.etac b{font-size:15px;display:block}
.etac span{font-size:12px;font-weight:800;color:var(--c)}
.etac small{display:block;font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:8px 22px;align-items:center}
.filters input{flex:1 1 240px;min-width:200px;background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:10px 14px;border-radius:12px;font-size:14px;outline:none}
.filters input:focus{border-color:var(--acc)}
.filters select{background:var(--panel);border:1px solid var(--line);color:var(--tx);padding:10px 12px;border-radius:12px;font-size:13px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{background:none;border:0;color:var(--mut);padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
main{padding:8px 22px 14px}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:1 0 290px;max-width:380px;background:rgba(17,26,48,.55);border:1px solid var(--line);border-top:3px solid var(--st);border-radius:var(--r);padding:10px}
.colh{display:flex;align-items:center;gap:8px;padding:6px 6px 12px}
.colh .cn{font-weight:800;font-size:14px;flex:1}
.cc{font-weight:800;font-size:13px;background:var(--panel2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
.ca{font-size:11px;color:var(--mut)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-left:5px solid var(--st);border-radius:14px;padding:12px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px rgba(0,0,0,.85);border-color:var(--st)}
.card.crit{box-shadow:0 0 0 1px rgba(239,68,68,.35)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eco{font-size:20px;font-weight:900;letter-spacing:.3px}
.dias{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);white-space:nowrap}
.dias.rojo{color:#fecaca;background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5)}
.sub{font-size:11px;color:var(--mut);margin-top:1px}
.vwrap{position:relative;height:98px;margin:6px 0 4px;display:flex;align-items:flex-end;justify-content:center;border-radius:10px;background:linear-gradient(180deg,transparent 78%,rgba(255,255,255,.035) 78%)}
.veh{height:94px;max-width:100%;overflow:visible}
.veh.mini{height:38px;width:auto}
.veh.mini2{height:44px;width:auto}
.veh.big{height:180px}
.badges{position:absolute;top:0;right:2px;display:flex;gap:3px}
.bdg{font-size:17px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);color:#cbd5f5;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.ext{border-color:rgba(245,158,11,.5);color:#fde68a}
.prog{display:flex;align-items:center;gap:8px}
.pb{flex:1;height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.pb i{display:block;height:100%;border-radius:99px;transition:width .9s ease}
.prog b{font-size:13px;font-weight:800;min-width:40px;text-align:right}
.cf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.verde{color:#bbf7d0;background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.45)}
.pill.ambar{color:#fde68a;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.5)}
.pill.rojo{color:#fecaca;background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.55);animation:blinkb 1.6s infinite}
.pill.gris{color:var(--mut);background:var(--bg2);border-color:var(--line)}
.pat{font-size:11px;color:var(--mut);white-space:nowrap}
.stp{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--st);color:#fff;white-space:nowrap}
.empty{color:var(--mut);font-size:12px;text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px;width:100%}
.yard{margin-bottom:18px}
.yardh{font-weight:900;font-size:15px;margin:4px 2px 10px;display:flex;gap:8px;align-items:center}
.lot{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));background:linear-gradient(180deg,#1b2338,#141b2c);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slot{padding:14px;border-right:2px dashed rgba(250,204,21,.38);border-bottom:2px dashed rgba(250,204,21,.16);cursor:pointer;transition:background .2s}
.slot:hover{background:rgba(255,255,255,.04)}
.tabla{width:100%;border-collapse:separate;border-spacing:0 8px}
.tabla th{font-size:11px;text-transform:uppercase;color:var(--mut);text-align:left;padding:0 10px;letter-spacing:.6px}
.tabla td{background:var(--panel);padding:8px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tabla td:first-child{border-left:5px solid var(--st);border-radius:12px 0 0 12px}
.tabla td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.tabla tr{cursor:pointer}
.tabla tr:hover td{background:var(--panel2)}
.libc{min-width:220px;display:flex;gap:10px;align-items:center;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.35);border-radius:12px;padding:8px 12px}
.libc b{display:block}
.libc small{color:var(--mut);font-size:11px}
footer{padding:10px 22px 26px;color:var(--mut);font-size:11px;text-align:center;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(3,6,15,.78);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.hidden{display:none}
.mbox{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;position:relative;animation:fade .25s}
.mx{position:absolute;top:14px;right:14px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}
.mhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px}
.mhead .eco{font-size:32px}
.mveh{display:flex;justify-content:center;padding:18px 0 10px;margin:12px 0;border-radius:16px;background:radial-gradient(ellipse at 50% 92%,rgba(255,255,255,.07),transparent 60%),var(--bg2);border:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.ringw{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.inf{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.inf small{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:2px}
.inf b{font-size:14px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:6px;font-size:13px}
.tl li:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--panel)}
.tl small{color:var(--mut);font-size:11px}
/* ---------- técnico animado ---------- */
.mveh{position:relative}
.meca{position:absolute;bottom:2px;width:31px;height:51px;transform:translateX(-50%);transition:left 2.4s linear;z-index:3;cursor:pointer}
.meca .cuerpo{width:100%;height:100%;transform:scaleX(var(--dir,1));transition:transform .25s}
.meca svg{width:100%;height:100%;overflow:visible;display:block}
.mveh .meca{width:52px;height:86px;bottom:8px}
.meca .ojos-x,.meca .boca-o,.meca .sudor,.meca .chispa{opacity:0}
.meca .brazo-d,.meca .brazo-i,.meca .pierna,.meca .cabeza,.meca .torso{transform-box:view-box}
.meca .brazo-d{transform-origin:23px 20px}
.meca .brazo-i{transform-origin:7px 20px}
.meca .pi{transform-origin:12.5px 34px}.meca .pd{transform-origin:17.5px 34px}
.meca .cabeza{transform-origin:15px 18px}
/* trabajando: golpea con la llave y saltan chispas */
.meca.trabaja .brazo-d{animation:golpe .42s ease-in-out infinite alternate}
.meca.trabaja .chispa{animation:chispa .84s ease-out infinite}
@keyframes golpe{from{transform:rotate(-40deg)}to{transform:rotate(28deg)}}
@keyframes chispa{0%,45%{opacity:0;transform:translate(0,0) scale(.4)}55%{opacity:1}100%{opacity:0;transform:translate(6px,-6px) scale(1.2)}}
/* caminando */
.meca.camina .pi{animation:paso .32s ease-in-out infinite alternate}
.meca.camina .pd{animation:paso .32s ease-in-out infinite alternate-reverse}
.meca.camina .torso,.meca.camina .cabeza{animation:rebote .32s ease-in-out infinite alternate}
.meca.camina .brazo-d{animation:balanceo .32s ease-in-out infinite alternate-reverse}
.meca.camina .brazo-i{animation:balanceo .32s ease-in-out infinite alternate}
@keyframes paso{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes rebote{from{transform:translateY(0)}to{transform:translateY(-1.2px)}}
@keyframes balanceo{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
/* expresión: se rasca la cabeza, suda y niega con la cabeza */
.meca.expresion .ojos-n,.meca.expresion .boca-n{opacity:0}
.meca.expresion .ojos-x,.meca.expresion .boca-o{opacity:1}
.meca.expresion .sudor{animation:sudor 1s ease-in infinite}
.meca.expresion .brazo-i{transform:rotate(155deg);animation:rasca .25s ease-in-out infinite alternate}
.meca.expresion .cabeza{animation:niega .5s ease-in-out infinite alternate}
@keyframes rasca{from{transform:rotate(145deg)}to{transform:rotate(165deg)}}
@keyframes niega{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes sudor{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(6px)}}
/* esperando refacciones: golpea el pie y cruza los brazos */
.meca.espera .pd{animation:tap .4s ease-in-out infinite alternate}
.meca.espera .brazo-d{transform:rotate(-70deg)}
.meca.espera .brazo-i{transform:rotate(70deg)}
.meca.espera .llave{opacity:0}
@keyframes tap{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
/* saludo al pasar el mouse */
.meca.saluda .brazo-i{animation:saludo .3s ease-in-out infinite alternate}
.meca.saluda .brazo-d{animation:none}
@keyframes saludo{from{transform:rotate(130deg)}to{transform:rotate(175deg)}}
.burbuja{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px) scale(.6);opacity:0;pointer-events:none;white-space:nowrap;background:#fff;color:#0f172a;font-size:11px;font-weight:800;padding:4px 8px;border-radius:10px;box-shadow:0 6px 16px -6px rgba(0,0,0,.7);transition:opacity .2s,transform .2s}
.burbuja:after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.meca.expresion .burbuja,.meca.saluda .burbuja{opacity:1;transform:translate(-50%,-4px) scale(1)}
.mveh .burbuja{font-size:13px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade{animation:fade .35s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.veh.drive{animation:bob .5s ease-in-out infinite}
.veh .speed line{animation:speed .8s linear infinite}
.veh .speed line:nth-child(2){animation-delay:.25s}.veh .speed line:nth-child(3){animation-delay:.5s}
@keyframes speed{0%{opacity:0;transform:translateX(10px)}50%{opacity:1}100%{opacity:0;transform:translateX(-14px)}}
.veh .humo circle{animation:humo 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.veh .humo circle:nth-child(2){animation-delay:.8s}.veh .humo circle:nth-child(3){animation-delay:1.6s}
@keyframes humo{0%{opacity:0;transform:translate(0,6px) scale(.5)}30%{opacity:.8}100%{opacity:0;transform:translate(-8px,-18px) scale(1.7)}}
.veh.espera{opacity:.62;filter:saturate(.35)}
.veh .aire{animation:blink 1.2s infinite}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes blinkb{50%{box-shadow:0 0 0 3px rgba(239,68,68,.18)}}
.spin{display:inline-block;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.tv .kv{font-size:38px}body.tv .eco{font-size:24px}body.tv .veh{height:112px}body.tv .vwrap{height:118px}body.tv .col{flex-basis:340px}
@media(max-width:760px){.mgrid{grid-template-columns:1fr}.kv{font-size:24px}.top{padding:12px 14px}.kpis,.filters,main{padding-left:14px;padding-right:14px}.strip{margin:10px 14px}.veh.big{height:130px}.sync{align-items:flex-start}}
</style>
</head>
<body>

<script>
/* =====================================================================
   CONFIGURACIÓN — URL de la aplicación web de Apps Script (Bot Taller)
   ===================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbxV4yJqwfxIvI4IY-_grb1R2LwLbxH8hMXliDqGlipf79N-7boQCnA8tYHDyQMEafYW/exec';
const INTERVALO_MIN = 60;   // minutos entre actualizaciones automáticas (solo en horario laboral)

const DIA = 86400000;
const DSEM = ['dom','lun','mar','mié','jue','vie','sáb'];
let DATA = null, CARGADO = 0, cargando = false;
const F = { q:'', clase:'all', tipo:'all', cat:'', patio:'', orden:'eta', vista:'flujo' };

/* ---------- utilidades ---------- */
function h(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function dia0(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function dd(n){ return ('0'+n).slice(-2); }
function ddmm(t){ const d=new Date(t); return dd(d.getDate())+'/'+dd(d.getMonth()+1); }
function hhmm(t){ const d=new Date(t); return dd(d.getHours())+':'+dd(d.getMinutes()); }
function fechaHora(t){ if(!t) return '—'; const d=new Date(t); return ddmm(t)+'/'+d.getFullYear()+' '+hhmm(t); }
function esCamion(u){ return u.subtipo==='tracto'||u.subtipo==='torton'; }
function resp(u){ return u.tipo==='Proveedor' ? '🏭 '+(u.proveedor||'Proveedor') : '👷 '+(u.tecnico||'Sin asignar'); }

function colorEstatus(e){ const n=norm(e);
  if(/disponib/.test(n)) return '#22c55e';
  if(/pendiente/.test(n)) return '#64748b';
  if(/diagn/.test(n)) return '#a855f7';
  if(/refacc/.test(n)) return '#f59e0b';
  if(/repar/.test(n)) return '#3b82f6';
  if(/prueba/.test(n)) return '#14b8a6';
  return '#94a3b8'; }
function iconoEstatus(e){ const n=norm(e);
  if(/pendiente/.test(n)) return '🅿️'; if(/diagn/.test(n)) return '🩺'; if(/refacc/.test(n)) return '📦';
  if(/repar/.test(n)) return '🔧'; if(/prueba/.test(n)) return '🛣️'; return '•'; }
function catInfo(c){ const n=norm(c);
  if(/colis|carroc|lamin|choque/.test(n)) return {k:'colision',ico:'💥'};
  if(/llant|neum/.test(n)) return {k:'llanta',ico:'🛞'};
  if(/electr/.test(n)) return {k:'electrica',ico:'⚡'};
  if(/suspens|fren|amortig/.test(n)) return {k:'suspension',ico:'🛠️'};
  if(/prevent|servicio/.test(n)) return {k:'preventivo',ico:'🧰'};
  return {k:'mecanica',ico:'⚙️'}; }
function etaInfo(t){
  if(!t) return {cls:'gris',txt:'Sin fecha',d:null};
  const d=Math.round((dia0(t)-dia0(Date.now()))/DIA);
  if(d<0) return {cls:'rojo',txt:'Vencida '+(-d)+' d',d:d};
  if(d===0) return {cls:'ambar',txt:'Hoy',d:0};
  if(d===1) return {cls:'verde',txt:'Mañana',d:1};
  return {cls:'verde',txt:'En '+d+' d',d:d}; }
function progColor(p){ return p>=80?'#22c55e':p>=50?'#3b82f6':p>=25?'#a855f7':'#64748b'; }
function barra(p){ return '<div class="prog"><div class="pb"><i style="width:'+p+'%;background:'+progColor(p)+'"></i></div><b>'+p+'%</b></div>'; }

/* ---------- dibujos a escala (SVG) ---------- */
function fit(txt,size,maxw){ return String(txt).length*size*0.62>maxw ? ' textLength="'+maxw+'" lengthAdjust="spacingAndGlyphs"' : ''; }
function placa(x,y,w,txt,size){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(size+8)+'" rx="4" fill="#fff" stroke="#0b1020" stroke-width="1.4"/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+size+2.5)+'" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="'+size+'" fill="#0f172a"'+fit(txt,size,w-8)+'>'+h(txt)+'</text>'; }
function rueda(x,y,flat){
  return flat
    ? '<ellipse cx="'+x+'" cy="'+(y+3)+'" rx="13" ry="8" fill="#0f172a" stroke="#475569" stroke-width="3"/><ellipse cx="'+x+'" cy="'+(y+3)+'" rx="4" ry="3" fill="#94a3b8"/>'+
      '<path class="aire" d="M'+(x+16)+' '+(y-3)+' q4 -3 8 0 M'+(x+17)+' '+(y+3)+' q4 -3 8 0" stroke="#cbd5e1" stroke-width="1.6" fill="none"/>'
    : '<circle cx="'+x+'" cy="'+y+'" r="11" fill="#0f172a" stroke="#475569" stroke-width="3"/><circle cx="'+x+'" cy="'+y+'" r="4" fill="#94a3b8"/>'; }
function golpe(cx,cy,r){
  let p='';
  for(let i=0;i<12;i++){ const a=i*Math.PI/6+0.3; const rr=(i%2? r*0.42 : r*(0.78+((i*7)%5)*0.08));
    p+=(cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1)+' '; }
  return '<polygon points="'+p+'" fill="#0b1020" opacity=".4"/><polygon points="'+p+'" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".8" transform="translate(1.2 1.2)"/>'+
    '<path d="M'+cx+' '+cy+' l'+(r*.95).toFixed(1)+' '+(-r*.55).toFixed(1)+' M'+cx+' '+cy+' l'+(-r*.8).toFixed(1)+' '+(r*.5).toFixed(1)+' M'+cx+' '+cy+' l'+(r*.15).toFixed(1)+' '+(r*.95).toFixed(1)+'" stroke="#0b1020" stroke-width="1.3" stroke-opacity=".75"/>'; }
function humo(x,y){ return '<g class="humo"><circle cx="'+x+'" cy="'+y+'" r="5" fill="#94a3b8"/><circle cx="'+(x+6)+'" cy="'+(y-2)+'" r="6" fill="#cbd5e1"/><circle cx="'+(x-4)+'" cy="'+(y-4)+'" r="4" fill="#94a3b8"/></g>'; }

function caja(u,col,cat){

  return {w:W,svg:s};

function vehiculo(u,extra){
  const col=colorEstatus(u.estatus), cat=catInfo(u.categoria).k, n=norm(u.estatus);
  let r;
  switch(u.subtipo){
    case 'tracto': r=tracto(u,col,cat); break;
    case 'torton': r=torton(u,col,cat); break;
    case 'dolly': r=dolly(u,col,cat); break;
    case 'plataforma': r=plataforma(u,col,cat); break;
    default: r=caja(u,col,cat);
  }
  let body=r.svg;
  if(cat==='suspension') body='<g transform="rotate(-3 '+(r.w*0.15).toFixed(0)+' 92)">'+body+'</g><path d="M'+(r.w*0.42).toFixed(0)+' 101 h18 l-5 -13 h-8 z" fill="#f59e0b" stroke="#0b1020" stroke-width="1"/>';
  const drive=/prueba/.test(n);
  if(drive) body='<g class="speed"><line x1="-6" y1="40" x2="-26" y2="40" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/><line x1="-4" y1="56" x2="-30" y2="56" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/><line x1="-8" y1="72" x2="-22" y2="72" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/></g>'+body;
  const cls='veh'+(drive?' drive':'')+(/pendiente/.test(n)?' espera':'')+(extra?' '+extra:'');
  return '<svg class="'+cls+'" viewBox="-32 0 '+(r.w+34)+' 106" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">'+body+'</svg>';
}
function badges(u){
  const c=catInfo(u.categoria), n=norm(u.estatus); let b='';
  if(c.k==='electrica') b+='<span class="bdg blink" title="Falla eléctrica">⚡</span>';
  if(c.k==='preventivo') b+='<span class="bdg" title="Preventivo">🧰</span>';
  if(c.k==='mecanica' && !esCamion(u)) b+='<span class="bdg spin" title="Mecánica">⚙️</span>';
  if(/refacc/.test(n)) b+='<span class="bdg" title="Espera refacciones">📦</span>';
  if(u.tipo==='Proveedor') b+='<span class="bdg" title="Con proveedor">🏭</span>';
  if(u.dias>=DATA.diasAlerta) b+='<span class="bdg blink" title="'+DATA.diasAlerta+'+ días en taller">🚨</span>';
  return b?'<div class="badges">'+b+'</div>':'';
}
function anillo(p){
  const r=34, C=2*Math.PI*r, off=C*(1-p/100), c=progColor(p);
  return '<svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="'+r+'" stroke="#22305a" stroke-width="9" fill="none"/>'+
    '<circle cx="46" cy="46" r="'+r+'" stroke="'+c+'" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 46 46)"/>'+
    '<text x="46" y="52" text-anchor="middle" font-family="Inter,Arial" font-weight="900" font-size="18" fill="#e8eeff">'+p+'%</text></svg>';
}

const FRASES={
  general:['¡Uff! 😓','Está duro… 😤','¿Y este tornillo? 🤔','¡#$%&! 🔧','😵‍💫','¡Ya casi sale! 💪','💦 Qué calor…','Necesito otra llave 🔩'],

  refacc:['⏳ ¿Y la refacción?','📦 ¿Ya llegó?','😴','Esperando… ⌛','Sin pieza no hay paraíso 😩'],
  prueba:['¡Suena bien! 👂','Probando… 🛣️','✅ ¡Jala!','Un ajustito más 🔧','¿Oíste ese ruido? 😬']

function hashTxt(t){ let x=0; for(const c of String(t)) x=(x*31+c.charCodeAt(0))%997; return x; }
function mecanico(u){
  if(u.tipo==='Proveedor') return '';
  const n=norm(u.estatus); let modo;
  if(/diagn/.test(n)) modo='diag'; else if(/refacc/.test(n)) modo='refacc'; else if(/prueba/.test(n)) modo='prueba'; else if(/repar/.test(n)) modo='general'; else return '';
  const x=18+(hashTxt(u.unidad)%60);
  return '<div class="meca '+(modo==='refacc'?'espera':'trabaja')+'" data-modo="'+modo+'" data-x="'+x+'" data-nom="'+h((u.tecnico||'Técnico').split(' ')[0])+'" data-av="'+u.avance+'" style="left:'+x+'%;--dir:'+(x<50?1:-1)+'">'+
    '<div class="burbuja"></div><div class="cuerpo">'+SVG_MECA+'</div></div>';
}
function estadoMeca(m,est){
  m.classList.remove('trabaja','camina','expresion','espera');
  m.classList.add(est);
  const x=+m.dataset.x||50;
  if(est==='camina'){
    let nx=10+Math.random()*78; if(Math.abs(nx-x)<15) nx=x<50?x+30:x-30;
    m.style.setProperty('--dir', nx<x?-1:1); m.style.left=nx+'%'; m.dataset.x=nx;
  }else{
    m.style.setProperty('--dir', x<50?1:-1);   // voltea hacia la unidad
  }
  if(est==='expresion'){
    const l=FRASES[m.dataset.modo]||FRASES.general;
    m.querySelector('.burbuja').textContent=l[Math.floor(Math.random()*l.length)];
  }
}
function animarMecanicos(){
  const ahora=Date.now();
  document.querySelectorAll('.meca').forEach(m=>{
    if(m.classList.contains('saluda') || (+m.dataset.hasta||0)>ahora) return;
    const r=Math.random(), refacc=m.dataset.modo==='refacc';
    let est, dur;
    if(r<0.18){ est='expresion'; dur=2600; }
    else if(r<0.40){ est='camina'; dur=2600; }
    else { est=refacc?'espera':'trabaja'; dur=3500+Math.random()*4500; }
    estadoMeca(m,est);
    m.dataset.hasta=ahora+dur;
  });
}
document.addEventListener('mouseover',e=>{
  const m=e.target.closest('.meca'); if(!m||m.classList.contains('saluda')) return;
  m.classList.add('saluda');
  m.querySelector('.burbuja').textContent='👋 '+m.dataset.nom+' · voy al '+m.dataset.av+'%';
});
document.addEventListener('mouseout',e=>{
  const m=e.target.closest('.meca'); if(!m||m.contains(e.relatedTarget)) return;
  m.classList.remove('saluda'); m.dataset.hasta=0;
});

    '<div class="ch"><div class="eco">'+h(u.unidad)+'</div><span class="stp">'+iconoEstatus(u.estatus)+' '+h(u.estatus)+'</span></div>'+
    '<div class="vwrap">'+vehiculo(u)+badges(u)+mecanico(u)+'</div>'+barra(u.avance)+
    '<div class="cf"><span class="pill '+e.cls+'">🎯 '+e.txt+'</span><span class="pat">'+u.dias+' d · '+h(resp(u))+'</span></div></div>';
}

/* ---------- filtros ---------- */
function filtrados(){
  const q=norm(F.q);
  return DATA.unidades.filter(u=>{
    if(F.clase!=='all' && (F.clase==='U')!==esCamion(u)) return false;
    if(F.tipo!=='all' && u.tipo!==F.tipo) return false;
    if(F.cat && u.categoria!==F.cat) return false;
    if(F.patio && u.patio!==F.patio) return false;
    if(q && norm([u.unidad,u.tecnico,u.proveedor,u.marca,u.obs,u.categoria,u.estatus,u.patio].join(' ')).indexOf(q)<0) return false;
    return true;
  }).sort((a,b)=>{
    if(F.orden==='dias') return b.dias-a.dias;
    if(F.orden==='avance') return b.avance-a.avance;
    if(F.orden==='eco') return a.unidad.localeCompare(b.unidad,'es',{numeric:true});
    return ((a.eta||9e15)-(b.eta||9e15)) || (b.dias-a.dias);
  });
}

/* ---------- render ---------- */
function renderKPIs(){
  const L=DATA.unidades, hoy=dia0(Date.now());
  const cam=L.filter(esCamion).length, rem=L.length-cam;
  const prom=L.length?Math.round(L.reduce((s,u)=>s+u.avance,0)/L.length):0;
  const hoyE=L.filter(u=>u.eta&&dia0(u.eta)===hoy).length;
  const venc=L.filter(u=>u.eta&&dia0(u.eta)<hoy).length;
  const crit=L.filter(u=>u.dias>=DATA.diasAlerta).length;
  const flota=(DATA.flota.U||0)+(DATA.flota.R||0);
  const disp=flota?((flota-L.length)/flota*100):null;
  const mt=DATA.mttr30&&DATA.mttr30.mttr!=null?DATA.mttr30.mttr.toFixed(1)+' d':'—';
  const k=(l,v,s,c)=>'<div class="kpi fade" style="--kc:'+(c||'#e8eeff')+'"><div class="kl">'+l+'</div><div class="kv">'+v+'</div><div class="ks">'+s+'</div></div>';
  document.getElementById('kpis').innerHTML=
    k('En taller',L.length,'🚛 '+cam+' camiones · 🚚 '+rem+' remolques','#e8eeff')+
    k('Avance promedio',prom+'%','reparaciones en curso',progColor(prom))+
    k('Entregas hoy',hoyE,'fecha estimada = hoy','#f59e0b')+
    k('Entregas vencidas',venc,'fecha estimada rebasada',venc?'#ef4444':'#22c55e')+
    k('Críticas',crit,DATA.diasAlerta+' días o más en taller',crit?'#ef4444':'#22c55e')+
    k('Disponibles hoy',DATA.liberadasHoy.length,'unidades liberadas','#22c55e')+
    k('Disponibilidad',disp==null?'—':disp.toFixed(1)+'%','flota operando ahora',disp==null?'#e8eeff':disp>=95?'#22c55e':disp>=90?'#f59e0b':'#ef4444')+
    k('MTTR 30 días',mt,(DATA.mttr30?DATA.mttr30.n:0)+' liberadas','#38bdf8');
}
function renderETA(){
  const con=DATA.unidades.filter(u=>u.eta).sort((a,b)=>a.eta-b.eta);
  const sin=DATA.unidades.length-con.length;
  let html=con.map(u=>{ const e=etaInfo(u.eta); const c=e.cls==='rojo'?'#ef4444':e.cls==='ambar'?'#f59e0b':'#22c55e';
    return '<div class="etac" style="--c:'+c+'" data-u="'+h(u.unidad)+'"><b>'+h(u.unidad)+'</b><span>'+e.txt+'</span><small>'+DSEM[new Date(u.eta).getDay()]+' '+ddmm(u.eta)+' · '+u.avance+'% · '+h(u.estatus)+'</small></div>'; }).join('');
  if(sin) html+='<div class="etac" style="--c:#64748b"><b>'+sin+'</b><span>Sin fecha</span><small>unidades sin entrega estimada</small></div>';
  document.getElementById('eta').innerHTML=html||'<div class="empty">Sin unidades en taller</div>';
}
function renderMain(){
  const L=filtrados(), m=document.getElementById('main');
  if(!L.length){ m.innerHTML='<div class="empty fade">Sin unidades con estos filtros</div>'; return; }
  if(F.vista==='lista') m.innerHTML=vistaLista(L);
  else if(F.vista==='patio') m.innerHTML=vistaPatio(L);
  else m.innerHTML=vistaFlujo(L);
}
function vistaFlujo(L){
  const est=DATA.estatus.concat(L.map(u=>u.estatus)).filter((e,i,a)=>e&&a.indexOf(e)===i);
  return '<div class="board fade">'+est.map(e=>{
    const g=L.filter(u=>u.estatus===e), col=colorEstatus(e);
    const av=g.length?Math.round(g.reduce((s,u)=>s+u.avance,0)/g.length):0;
    return '<div class="col" style="--st:'+col+'"><div class="colh"><span class="cn">'+iconoEstatus(e)+' '+h(e)+'</span>'+(g.length?'<span class="ca">'+av+'% prom.</span>':'')+'<span class="cc">'+g.length+'</span></div>'+
      '<div class="cards">'+(g.length?g.map(card).join(''):'<div class="empty">Sin unidades</div>')+'</div></div>';
  }).join('')+'</div>';
}
function vistaPatio(L){
  const pats=L.map(u=>u.patio||'Sin patio').filter((p,i,a)=>a.indexOf(p)===i);
  return pats.map(p=>{ const g=L.filter(u=>(u.patio||'Sin patio')===p);
    return '<div class="yard fade"><div class="yardh">📍 '+h(p)+' <span class="cc">'+g.length+'</span></div><div class="lot">'+g.map(slot).join('')+'</div></div>'; }).join('');
}
function vistaLista(L){
  return '<table class="tabla fade"><tr><th>Unidad</th><th></th><th>Estatus</th><th>Falla</th><th>Responsable</th><th style="width:170px">Avance</th><th>Entrega</th><th>Días</th></tr>'+
    L.map(u=>{ const e=etaInfo(u.eta);
      return '<tr data-u="'+h(u.unidad)+'" style="--st:'+colorEstatus(u.estatus)+'"><td><b>'+h(u.unidad)+'</b><div class="sub">'+h(u.patio||'')+'</div></td>'+
        '<td>'+vehiculo(u,'mini')+'</td><td><span class="stp">'+iconoEstatus(u.estatus)+' '+h(u.estatus)+'</span></td>'+
        '<td>'+catInfo(u.categoria).ico+' '+h(u.categoria||'—')+'</td><td>'+h(resp(u))+'</td><td>'+barra(u.avance)+'</td>'+
        '<td><span class="pill '+e.cls+'">'+e.txt+(u.eta?' · '+ddmm(u.eta):'')+'</span></td>'+
        '<td><b'+(u.dias>=DATA.diasAlerta?' style="color:#f87171"':'')+'>'+u.dias+'</b></td></tr>'; }).join('')+'</table>';
}
function render(){ renderKPIs(); renderETA(); renderMain(); }

/* ---------- ficha de la unidad ---------- */
function abrir(eco){
  const u=DATA.unidades.find(x=>x.unidad===eco); if(!u) return;
  const e=etaInfo(u.eta), c=catInfo(u.categoria);
  const inf=(l,v)=>'<div class="inf"><small>'+l+'</small><b>'+v+'</b></div>';
  const equipo=[u.marca,u.anio,u.medida?u.medida+"'":'',u.serie?'Serie '+u.serie:''].filter(Boolean).join(' · ')||'—';
  const movs=u.movs.length?u.movs.map(m=>{
    const tit=m.de==='(Ingreso)'?'Ingreso · '+h(m.a):(m.de===m.a?h(m.c||m.a):h(m.de)+' → '+h(m.a));
    return '<li><b>'+tit+'</b><br><small>'+fechaHora(m.f)+' · '+h(m.u)+'</small>'+(m.c&&m.de!==m.a&&m.de!=='(Ingreso)'?'<div class="sub">'+h(m.c)+'</div>':'')+'</li>';
  }).join(''):'<li><small>Sin movimientos registrados</small></li>';
  document.getElementById('mbody').innerHTML=
    '<div class="mhead" style="--st:'+colorEstatus(u.estatus)+'"><div class="eco">'+h(u.unidad)+'</div><span class="stp">'+iconoEstatus(u.estatus)+' '+h(u.estatus)+'</span>'+
      '<span class="pill '+e.cls+'">🎯 '+e.txt+'</span>'+(u.dias>=DATA.diasAlerta?'<span class="pill rojo">🚨 '+u.dias+' días</span>':'')+'</div>'+
    '<div class="sub" style="margin-top:4px">'+h(equipo)+'</div>'+
    '<div class="mveh">'+vehiculo(u,'big')+mecanico(u)+'</div>'+
    '<div class="mgrid"><div>'+
      '<div class="ringw">'+anillo(u.avance)+'<div><div class="kl">Avance de reparación</div><div class="sub" style="font-size:13px;margin-top:4px">'+c.ico+' '+h(u.categoria||'Sin categoría')+'</div></div></div>'+
      '<div class="info">'+
        inf('Patio',h(u.patio||'—'))+inf('Días en taller',u.dias)+
        inf('Ingreso',fechaHora(u.ingreso))+inf('Entrega estimada',u.eta?DSEM[new Date(u.eta).getDay()]+' '+ddmm(u.eta)+'/'+new Date(u.eta).getFullYear():'Sin fecha')+
        inf('Responsable',h(resp(u)))+inf('Kilometraje',u.km!=null?Number(u.km).toLocaleString('es-MX')+' km':'—')+
        inf('Última actualización',fechaHora(u.ultAct))+inf('Actualizó',h(u.actualizo||'—'))+
      '</div>'+
      (u.obs?'<div class="inf" style="margin-top:10px"><small>Observaciones</small><b style="font-weight:600">'+h(u.obs)+'</b></div>':'')+
    '</div><div><div class="kl" style="margin-bottom:10px">Historial de esta visita</div><ul class="tl">'+movs+'</ul></div></div>';
  document.getElementById('modal').classList.remove('hidden');
}
function cerrar(){ document.getElementById('modal').classList.add('hidden'); }

/* ---------- horario laboral (viene de la hoja Config) ---------- */
function horario(){ return (DATA&&DATA.horario)||{ini:8,finLV:17,finSab:13}; }
function enHorario(d){
  d=d||new Date(); const H=horario(), dow=d.getDay(), hr=d.getHours()+d.getMinutes()/60;
  if(dow===0) return false;
  return hr>=H.ini && hr<(dow===6?H.finSab:H.finLV);
}
function textoHorario(){
  const H=horario();
  return 'Actualización automática cada '+(INTERVALO_MIN>=60?(INTERVALO_MIN/60)+' h':INTERVALO_MIN+' min')+
    ' · L–V '+H.ini+':00–'+H.finLV+':00 · Sáb '+H.ini+':00–'+H.finSab+':00 · Domingo sin actualización';
}

/* ---------- carga de datos (Google Sheets vía Apps Script) ---------- */
function setSync(t,clase){ document.getElementById('sync').textContent=t; document.getElementById('dot').className='dot'+(clase?' '+clase:''); }
function poblarFiltros(){
  const cats=DATA.categorias.concat(DATA.unidades.map(u=>u.categoria)).filter((x,i,a)=>x&&a.indexOf(x)===i);
  const pats=DATA.patios.concat(DATA.unidades.map(u=>u.patio)).filter((x,i,a)=>x&&a.indexOf(x)===i);
  document.getElementById('fCat').innerHTML='<option value="">Todas las fallas</option>'+cats.map(c=>'<option'+(c===F.cat?' selected':'')+'>'+h(c)+'</option>').join('');
  document.getElementById('fPatio').innerHTML='<option value="">Todos los patios</option>'+pats.map(c=>'<option'+(c===F.patio?' selected':'')+'>'+h(c)+'</option>').join('');
}
async function cargar(){
  if(cargando) return;
  cargando=true; setSync('Actualizando…'); document.getElementById('btnRef').classList.add('girando');
  try{
    const r=await fetch(API+'?v=datos&t='+Date.now(),{cache:'no-store'});
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    DATA=d; CARGADO=Date.now();
    poblarFiltros(); render();
  }catch(err){
    setSync('⚠️ Sin conexión con la hoja','err');
  }
  cargando=false; document.getElementById('btnRef').classList.remove('girando'); tick();
}
function revisarAuto(){
  if(!CARGADO || cargando) return;
  if(enHorario() && Date.now()-CARGADO >= INTERVALO_MIN*60000) cargar();
}
function tick(){
  const n=new Date();
  document.getElementById('hora').textContent=dd(n.getHours())+':'+dd(n.getMinutes())+':'+dd(n.getSeconds());
  document.getElementById('fecha').textContent=n.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  if(!CARGADO||cargando) return;
  const min=Math.floor((Date.now()-CARGADO)/60000);
  const hace=min<1?'hace un momento':min<60?'hace '+min+' min':'hace '+Math.floor(min/60)+' h '+(min%60)+' min';
  const prox=document.getElementById('prox');
  if(enHorario()){
    setSync('Actualizado '+hace);
    prox.textContent='Próxima actualización: '+hhmm(CARGADO+INTERVALO_MIN*60000);
  }else{
    setSync('Actualizado '+hace,'pausa');
    prox.textContent='⏸ Fuera de horario laboral · actualización automática en pausa';
  }
}

/* ---------- tema por temporada ---------- */
function temporada(){
  const d=new Date(), md=(d.getMonth()+1)*100+d.getDate();
  if(md>=1201||md<=106) return {n:'Temporada navideña',e:'🎄',a:'#ef4444',b:'#16a34a'};
  if(md>=901&&md<=916) return {n:'Fiestas patrias',e:'🇲🇽',a:'#16a34a',b:'#dc2626'};
  if(md>=1025&&md<=1103) return {n:'Día de Muertos',e:'🏵️',a:'#f97316',b:'#a855f7'};
  if(md>=321&&md<=620) return {n:'Primavera',e:'🌸',a:'#ec4899',b:'#22c55e'};
  if(md>=621&&md<=922) return {n:'Verano',e:'☀️',a:'#f59e0b',b:'#06b6d4'};
  if(md>=923&&md<=1130) return {n:'Otoño',e:'🍂',a:'#f59e0b',b:'#ea580c'};
  return {n:'Invierno',e:'❄️',a:'#38bdf8',b:'#818cf8'};
}
(function(){ const t=temporada(); const r=document.documentElement.style;
  r.setProperty('--acc',t.a); r.setProperty('--acc2',t.b);
  document.getElementById('season').textContent=t.e+' '+t.n; })();

/* ---------- eventos ---------- */
document.getElementById('q').addEventListener('input',e=>{ F.q=e.target.value; if(DATA) renderMain(); });
['fClase','fTipo','fVista'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const key={fClase:'clase',fTipo:'tipo',fVista:'vista'}[id]; F[key]=b.dataset.v; if(DATA) renderMain();
  });
});
document.getElementById('fCat').addEventListener('change',e=>{ F.cat=e.target.value; if(DATA) renderMain(); });
document.getElementById('fPatio').addEventListener('change',e=>{ F.patio=e.target.value; if(DATA) renderMain(); });
document.getElementById('fOrden').addEventListener('change',e=>{ F.orden=e.target.value; if(DATA) renderMain(); });
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-u]'); if(el && DATA && !e.target.closest('.mbox')) abrir(el.dataset.u);
});
document.getElementById('mx').addEventListener('click',cerrar);
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') cerrar(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });
document.getElementById('btnRef').addEventListener('click',cargar);
document.getElementById('btnTv').addEventListener('click',()=>{
  document.body.classList.toggle('tv');
  try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(x){}
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) revisarAuto(); });

cargar();
setInterval(tick,1000);
setInterval(revisarAuto,60000);
setInterval(animarMecanicos,700);
</script>
